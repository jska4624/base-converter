<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>進制轉換器</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9eef5;--card:#fff;--ink:#16213a;--mute:#5b6786;--line:#cfd8e6;--acc:#2f4bd8;--acc-ink:#fff;--err:#c2321f}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162a;--card:#19213b;--ink:#e8ecf8;--mute:#9aa6c7;--line:#2d3857;--acc:#7b93ff;--acc-ink:#10162a;--err:#ff8f7e}}
:root[data-theme="dark"]{--bg:#10162a;--card:#19213b;--ink:#e8ecf8;--mute:#9aa6c7;--line:#2d3857;--acc:#7b93ff;--acc-ink:#10162a;--err:#ff8f7e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.num{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body class="min-h-screen">
<main class="mx-auto max-w-md px-4 py-6">
  <h1 class="text-2xl font-bold">進制轉換器</h1>
  <p class="mt-1 text-sm" style="color:var(--mute)">支援 2～36 進制、負數與大數</p>

  <section class="mt-5 rounded-xl p-4" style="background:var(--card);border:1px solid var(--line)">
    <label for="inp" class="text-sm font-medium">輸入數字</label>
    <input id="inp" class="num mt-1 w-full rounded-lg px-3 py-3 text-xl" style="background:var(--bg);border:1px solid var(--line);color:var(--ink)" value="1010" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text">
    <p id="err" class="mt-2 min-h-[1.25rem] text-sm" style="color:var(--err)" role="alert"></p>

    <div class="mt-2 grid grid-cols-[1fr_auto_1fr] items-end gap-2">
      <div>
        <label for="from" class="text-sm font-medium">來源進制</label>
        <select id="from" class="mt-1 w-full rounded-lg px-2 py-2" style="background:var(--bg);border:1px solid var(--line);color:var(--ink)"></select>
      </div>
      <button id="swap" class="rounded-lg px-3 py-2" style="border:1px solid var(--line)" aria-label="交換來源與目標進制">⇄</button>
      <div>
        <label for="to" class="text-sm font-medium">目標進制</label>
        <select id="to" class="mt-1 w-full rounded-lg px-2 py-2" style="background:var(--bg);border:1px solid var(--line);color:var(--ink)"></select>
      </div>
    </div>

    <div class="mt-3 flex gap-2" id="quick" aria-label="常用目標進制"></div>
  </section>

  <section class="mt-4 rounded-xl p-4" style="background:var(--card);border:1px solid var(--line)">
    <div class="flex items-center justify-between">
      <h2 class="text-sm font-medium">結果</h2>
      <button id="copy" class="rounded-lg px-3 py-1 text-sm" style="background:var(--acc);color:var(--acc-ink)">複製結果</button>
    </div>
    <p id="out" class="num mt-2 break-all text-3xl font-semibold">—</p>
  </section>

  <details class="mt-4 rounded-xl p-4" style="background:var(--card);border:1px solid var(--line)">
    <summary class="cursor-pointer text-sm font-medium">轉換過程</summary>
    <div id="steps" class="num mt-3 space-y-1 text-sm" style="color:var(--mute)"></div>
  </details>
</main>

<script>
const D = "0123456789abcdefghijklmnopqrstuvwxyz";
const $ = id => document.getElementById(id);

// 其他進制 → 十進位：result = result * base + digit
function toDecimal(str, base) {
  let r = 0n, steps = [];
  for (const ch of str) {
    const d = BigInt(D.indexOf(ch)), prev = r;
    r = r * BigInt(base) + d;
    steps.push(`${prev} × ${base} + ${d} = ${r}`);
  }
  return { value: r, steps };
}

// 十進位 → 其他進制：不斷除以目標進制，餘數反向排列
function fromDecimal(n, base) {
  if (n === 0n) return { text: "0", steps: ["0 ÷ " + base + " = 0 … 0"] };
  let digits = "", steps = [], b = BigInt(base);
  while (n > 0n) {
    const q = n / b, r = n % b;
    steps.push(`${n} ÷ ${base} = ${q} … ${D[Number(r)]}`);
    digits = D[Number(r)] + digits;
    n = q;
  }
  return { text: digits, steps };
}

function convert(input, from, to) {
  let s = input.trim().toLowerCase(), neg = false;
  if (s.startsWith("-")) { neg = true; s = s.slice(1); }
  if (!s) return { error: "" };
  const bad = [...s].find(c => D.indexOf(c) < 0 || D.indexOf(c) >= from);
  if (bad) return { error: `「${bad}」不是合法的 ${from} 進制數字（可用：${D.slice(0, from).toUpperCase()}）` };
  const a = toDecimal(s, from), b = fromDecimal(a.value, to);
  return { text: (neg && a.value !== 0n ? "-" : "") + b.text.toUpperCase(), a, b };
}

function render() {
  const from = +$("from").value, to = +$("to").value;
  const r = convert($("inp").value, from, to);
  $("err").textContent = r.error || "";
  $("out").textContent = r.text ?? "—";
  const st = $("steps"); st.innerHTML = "";
  if (!r.text) return;
  const add = (t, strong) => { const p = document.createElement("p"); p.textContent = t; if (strong) p.style.color = "var(--ink)"; st.appendChild(p); };
  if (from !== 10) { add(`① ${from} 進制 → 十進位（由左到右）`, true); r.a.steps.forEach(x => add(x)); }
  if (to !== 10) { add(`② 十進位 ${r.a.value} → ${to} 進制（餘數由下往上讀）`, true); r.b.steps.forEach(x => add(x)); }
  if (from === 10 && to === 10) add("來源與目標相同，不需要轉換");
}

for (let b = 2; b <= 36; b++) for (const id of ["from", "to"]) $(id).add(new Option(b + " 進制", b));
$("from").value = 2; $("to").value = 10;

[2, 8, 10, 16].forEach(b => {
  const btn = document.createElement("button");
  btn.textContent = b + " 進制";
  btn.className = "flex-1 rounded-lg px-2 py-2 text-sm";
  btn.style.border = "1px solid var(--line)";
  btn.onclick = () => { $("to").value = b; render(); };
  $("quick").appendChild(btn);
});

$("swap").onclick = () => {
  const f = $("from").value; $("from").value = $("to").value; $("to").value = f;
  const t = $("out").textContent; if (t !== "—") $("inp").value = t;
  render();
};
$("copy").onclick = async () => {
  const t = $("out").textContent; if (t === "—") return;
  try { await navigator.clipboard.writeText(t); $("copy").textContent = "已複製"; }
  catch { $("copy").textContent = "請手動複製"; }
  setTimeout(() => $("copy").textContent = "複製結果", 1200);
};
["inp", "from", "to"].forEach(id => $(id).addEventListener("input", render));
render();
</script>
</body>
</html>
